security:
    password_hashers:
        Symfony\Component\Security\Core\User\PasswordAuthenticatedUserInterface: 'auto'

    providers:
        app_user_provider:
            id: App\Security\UserProvider

    role_hierarchy:
        ROLE_ADMIN: [ROLE_CABINET, ROLE_DG, ROLE_DIRECTEUR, ROLE_RESPONSABLE, ROLE_CONSULTATION, ROLE_USER]
        ROLE_CABINET: [ROLE_DG, ROLE_DIRECTEUR, ROLE_RESPONSABLE, ROLE_CONSULTATION, ROLE_USER]
        ROLE_DG: [ROLE_DIRECTEUR, ROLE_RESPONSABLE, ROLE_CONSULTATION, ROLE_USER]
        ROLE_DIRECTEUR: [ROLE_RESPONSABLE, ROLE_CONSULTATION, ROLE_USER]
        ROLE_RESPONSABLE: [ROLE_CONSULTATION, ROLE_USER]
        ROLE_CONSULTATION: [ROLE_USER]

    firewalls:
        dev:
            pattern: ^/(_profiler|_wdt|assets|build|css|js|images)/
            security: false
        main:
            lazy: true
            provider: app_user_provider
            form_login:
                login_path: app_login
                check_path: app_login
                username_parameter: _username
                password_parameter: _password
                default_target_path: app_dashboard
                enable_csrf: true
            logout:
                path: app_logout
                target: app_login

    access_control:
        - { path: ^/login, roles: PUBLIC_ACCESS }
        - { path: ^/admin, roles: ROLE_ADMIN }
        - { path: ^/, roles: ROLE_USER }

when@test:
    security:
        password_hashers:
            Symfony\Component\Security\Core\User\PasswordAuthenticatedUserInterface:
                algorithm: auto
                cost: 4
                time_cost: 3
                memory_cost: 10
