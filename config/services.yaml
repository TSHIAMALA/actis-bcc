parameters:
    justificatifs_directory: '%kernel.project_dir%/public/uploads/justificatifs'
    # Hors de public/ : servis uniquement via le contrôleur (utilisateurs connectés)
    instructions_documents_directory: '%kernel.project_dir%/var/uploads/instructions'

services:
    _defaults:
        autowire: true
        autoconfigure: true
        bind:
            string $targetDirectory: '%justificatifs_directory%'

    App\:
        resource: '../src/'

    App\Service\FileUploader:
        arguments:
            $targetDirectory: '%justificatifs_directory%'

    App\Service\InstructionDocumentStorage:
        arguments:
            $targetDirectory: '%instructions_documents_directory%'
